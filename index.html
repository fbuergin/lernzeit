<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Lernzeit</title>
  <meta name="description" content="Zeit-Tracker für den Unialltag: Lernen, Serien, Vorlesungen, Gym.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lernzeit">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title">Heute</h1>
    </div>
    <button class="icon-btn glass" id="topAction" data-action="addManual" aria-label="Session nachtragen">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <nav class="tabbar glass" id="tabbar">
    <button data-tab="today" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2M9.5 2.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Heute</span>
    </button>
    <button data-tab="stats" class="tab">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Statistik</span>
    </button>
    <button data-tab="history" class="tab">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="4" cy="12" r="1.3" fill="currentColor"/><circle cx="4" cy="18" r="1.3" fill="currentColor"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" data-action="closeSheet"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="sheetContent"></div>
  </div>

  <div class="toast glass" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
